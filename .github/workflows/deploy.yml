name: Deploy HireFlow

on:
  push:
    branches:
      - master

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 487916111463.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          docker build -t $ECR_REGISTRY/hireflow-backend:latest ./apps/backend
          docker push $ECR_REGISTRY/hireflow-backend:latest

      - name: Build and push ml-service
        run: |
          docker build -t $ECR_REGISTRY/hireflow-ml-service:latest ./apps/ml-service
          docker push $ECR_REGISTRY/hireflow-ml-service:latest

      - name: Build and push frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=https://api.whapps.site \
            -t $ECR_REGISTRY/hireflow-frontend:latest \
            ./apps/frontend
          docker push $ECR_REGISTRY/hireflow-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 487916111463.dkr.ecr.ap-south-1.amazonaws.com
            cd hireflow
            docker-compose pull
            docker-compose up -d --force-recreate
            docker image prune -f
